name: Refresh FurbyMarket listings

on:
  schedule:
    - cron: "0 6,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: furby-market-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out Furbypedia
        uses: actions/checkout@v4
      - name: Refresh recent Mercado Libre listings
        run: python .github/scripts/update-market.py
      - name: Commit feed when it changes
        run: |
          if git diff --quiet -- market-listings.json; then
            echo "No feed changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-listings.json
          git commit -m "Refresh FurbyMarket listings"
          git push
